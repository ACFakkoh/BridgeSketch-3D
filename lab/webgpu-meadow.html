<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BridgeSketch 3D · WebGPU meadow lab</title>
    <link rel="icon" href="../favicon.svg" />
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three.webgpu.min.js",
          "three/webgpu": "../vendor/three.webgpu.min.js",
          "three/tsl": "../vendor/three.tsl.min.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9fb8c8;
        font: 13px/1.45 'Segoe UI', Arial, sans-serif;
        color: #eaf6f2;
      }
      #hud {
        position: fixed;
        left: 14px;
        top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #0b1f2ed9;
        max-width: 360px;
      }
      #hud h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      #hud b {
        color: #73e4c2;
      }
      #hud label {
        display: block;
        margin-top: 6px;
      }
      #stats {
        font: 600 12px/1.5 ui-monospace, Consolas, monospace;
        color: #cdeee4;
      }
      #hud p {
        margin: 6px 0 0;
        color: #a9c4d1;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>WebGPU meadow &amp; rain · lab</h1>
      <div id="stats">Starting…</div>
      <label
        >Grass blades
        <select id="count">
          <option>50000</option>
          <option selected>150000</option>
          <option>300000</option>
          <option>600000</option>
        </select></label
      >
      <label><input id="rain" type="checkbox" checked /> Rain (compute particles)</label>
      <p>
        Test page for BridgeSketch 3D 0.5.5: Three.js r180 WebGPURenderer with TSL. Blade bending and rain drops are
        integrated in compute shaders; the main viewer stays on WebGL 2. Compare the frame rate with the viewer's
        Stats overlay on the same computer.
      </p>
    </div>
    <script type="module" src="./webgpu-meadow.mjs"></script>
  </body>
</html>
